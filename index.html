<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Calendar</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 15px;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .weekday { font-weight: bold; padding: 5px; color: var(--tg-theme-hint-color, #aaa); }
        .day { padding: 10px 5px; border-radius: 8px; cursor: pointer; background: var(--tg-theme-secondary-bg-color, #f0f0f0); min-height: 40px; position: relative;}
        .day.past { opacity: 0.6; } /* Прошедшие даты блеклые */
        .day.today { border: 2px solid var(--tg-theme-button-color, #2481cc); }
        .has-event::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; background: #ff3b30; border-radius: 50%; }
        
        /* Модальное окно */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: var(--tg-theme-bg-color, #fff); padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: var(--tg-theme-button-color, #2481cc); color: #fff; border: none; cursor: pointer; }
        .btn-close { background: #ff3b30; }
    </style>
</head>
<body>

    <div class="calendar-header">
        <button onclick="changeMonth(-1)">◀</button>
        <h2 id="month-title"></h2>
        <button onclick="changeMonth(1)">▶</button>
    </div>

    <div class="calendar-grid" id="calendar-days"></div>

    <!-- Модальное окно просмотра / создания -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <h3 id="modal-date-title"></h3>
            <div id="events-list"></div>
            
            <div id="create-form">
                <input type="text" id="event-text" placeholder="Описание события...">
                <button onclick="saveEvent()">Сохранить событие</button>
            </div>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Д.WebApp;
        tg.ready();
        tg.expand();

        const API_BASE_URL = ""; 
        let savedEvents = {};
        let currentDate = new Date();
        let selectedDateStr = "";

        async function loadEventsFromDB() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/events/get`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' 
                    },
                    body: JSON.stringify({ initData: tg.initData })
                });
                if (response.ok) {
                    savedEvents = await response.json();
                    renderCalendar();
                }
            } catch (err) {
                console.error("Ошибка загрузки данных из БД:", err);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('month-title').innerText = `${monthNames[month]} ${year}`;
            
            const grid = document.getElementById('calendar-days');
            grid.innerHTML = '';
            
            // Дни недели
            ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].forEach(d => {
                grid.innerHTML += `<div class="weekday">${d}</div>`;
            });
            
            // Смещение для первого дня месяца (Пн = 0)
            let shift = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            for(let i=0; i<shift; i++) grid.innerHTML += '<div></div>';
            
            const today = new Date();
            today.setHours(0,0,0,0);

            for (let day = 1; day <= totalDays; day++) {
                const dateBox = new Date(year, month, day);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                
                let classes = ['day'];
                if (dateBox < today) classes.push('past');
                if (dateBox.getTime() === today.getTime()) classes.push('today');
                if (savedEvents[dateStr]) classes.push('has-event');
                
                grid.innerHTML += `<div class="${classes.join(' ')}" onclick="openDate('${dateStr}', ${dateBox < today})">${day}</div>`;
            }
        }

        function openDate(dateStr, isPast) {
            selectedDateStr = dateStr;
            document.getElementById('modal-date-title').innerText = dateStr;
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            if (savedEvents[dateStr]) {
                savedEvents[dateStr].forEach(ev => {
                    list.innerHTML += `<p>• ${ev}</p>`;
                });
            } else {
                list.innerHTML = '<p>Нет событий на этот день</p>';
            }

            if (isPast) {
                document.getElementById('create-form').style.display = 'none';
            } else {
                document.getElementById('create-form').style.display = 'block';
            }

            document.getElementById('event-modal').style.display = 'flex';
        }

        async function saveEvent() {
            const text = document.getElementById('event-text').value.trim();
            if (!text) return;

            const checkDate = new Date(selectedDateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            if (checkDate < today) {
                alert("Нельзя создавать события в прошлом!");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/events/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({
                        initData: tg.initData,
                        event_date: selectedDateStr,
                        text: text
                    })
                });

                if (response.ok) {
                    if (!savedEvents[selectedDateStr]) savedEvents[selectedDateStr] = [];
                    savedEvents[selectedDateStr].push(text);
                    
                    document.getElementById('event-text').value = '';
                    closeModal();
                    renderCalendar();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
                } else {
                    const errData = await response.json();
                    alert(errData.detail || "Ошибка при сохранении");
                }
            } catch (err) {
                alert("Ошибка сети");
            }
        }

        function closeModal() { document.getElementById('event-modal').style.display = 'none'; }
        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); renderCalendar(); }

        // Стартовая инициализация
        loadEventsFromDB();
    </script>

</body>
</html>
